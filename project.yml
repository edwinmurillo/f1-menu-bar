name: F1MenuBar
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  F1Core:
    type: framework
    platform: macOS
    sources:
      - Domain
      - Data
      - State
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.murilloarturo.f1menubar.core
        SKIP_INSTALL: YES
  F1MenuBar:
    type: application
    platform: macOS
    sources:
      - App
      - Features
    dependencies:
      - target: F1Core
    settings:
      base:
        PRODUCT_NAME: F1 Menu Bar
        PRODUCT_BUNDLE_IDENTIFIER: com.murilloarturo.f1menubar
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Arturo Murillo
        CODE_SIGN_ENTITLEMENTS: App/F1MenuBar.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  F1CoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: F1Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.murilloarturo.f1menubar.tests
schemes:
  F1MenuBar:
    build:
      targets:
        F1MenuBar: all
        F1CoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - F1CoreTests
      gatherCoverageData: false
    archive:
      config: Release
